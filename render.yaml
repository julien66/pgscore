# Déploiement sur Render (Blueprint) : un service web Node avec un disque pour la base SQLite et
# les fichiers IGC. Le disque impose une seule instance et un plan payant (Starter ou plus).
services:
  - type: web
    name: pgscore
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @pgscore/engine build
    # node --import tsx : un seul processus (npx tsx en lançait trois, environ 135 Mo de plus).
    startCommand: cd apps/web && node --import tsx src/main.tsx
    healthCheckPath: /healthz
    # Déploiement seulement quand la vérification GitHub (CI : types et tests) est passée.
    autoDeployTrigger: checksPass
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      # Le plan Starter a 512 Mo : on borne le tas du serveur (256 Mo) et celui du calcul (160 Mo, dans
      # runner.ts) pour que Node libère la mémoire avant d'y arriver. Envois et imports passent par le disque.
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
      - key: DATABASE_PATH
        value: /var/data/pgscore.db
      - key: TRACKS_DIR
        value: /var/data/tracks
      # Adresse publique : par défaut celle de Render (https://pgscore-xxxx.onrender.com).
      # À renseigner avec le nom de domaine s'il y en a un.
      - key: BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Administrateurs (e-mails séparés par des virgules) : ils modifient toutes les compétitions.
      - key: ADMIN_EMAILS
        sync: false
